services:
  zpush:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9003:9003"
    environment:
      - DB_HOST=mysql
      - DB_USER=zpush
      - DB_PASSWORD=zpush
      - DB_NAME=zpush
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - LOG_LEVEL=info
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-admin}
      - EVENT_PROCESSOR_CONCURRENCY=4
      - DELIVERY_WORKER_CONCURRENCY=8
      - MAX_PAYLOAD_BYTES=1048576
      - INGEST_GLOBAL_RATE_LIMIT=100/200
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zpush}
      MYSQL_DATABASE: zpush
      MYSQL_USER: zpush
      MYSQL_PASSWORD: zpush
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
