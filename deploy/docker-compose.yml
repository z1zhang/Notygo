services:
  notygo:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9003:9003"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=notygo
      - DB_PASSWORD=notygo
      - DB_NAME=notygo
      - DB_SSLMODE=disable
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - LOG_LEVEL=info
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-admin}
      - QUEUE_EVENT_CONCURRENCY=4
      - QUEUE_DELIVERY_CONCURRENCY=8
      - RIVER_JOB_RETENTION=24h
      - MAX_PAYLOAD_BYTES=1048576
      - INGEST_GLOBAL_RATE_LIMIT=100/200
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notygo
      POSTGRES_USER: notygo
      POSTGRES_PASSWORD: notygo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notygo", "-d", "notygo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
