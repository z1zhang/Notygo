additionalProperties:
  formFields:
    - default: 9003
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      labelZh: 端口
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: ENCRYPTION_MASTER_KEY
      labelEn: "Encryption Master Key (format v1:base64, run openssl rand -base64 32 and prefix v1:)"
      labelZh: "加密主密钥（格式 v1:base64，生成命令 openssl rand -base64 32，前面加 v1:）"
      required: true
      type: password
    - default: admin
      edit: true
      envKey: ADMIN_INITIAL_USER
      labelEn: Initial Admin Username
      labelZh: 初始管理员用户名
      required: true
      rule: paramCommon
      type: text
    - default: admin
      edit: true
      envKey: ADMIN_INITIAL_PASSWORD
      labelEn: Initial Admin Password
      labelZh: 初始管理员密码
      random: true
      required: true
      rule: paramComplexity
      type: password
    # 数据库绑定：type: apps 触发 1Panel 自动建库/建用户/生成密码
    - type: apps
      default: postgres
      edit: false
      envKey: PANEL_DB_TYPE
      labelEn: Database Service
      labelZh: 数据库服务
      description:
        zh: 选择已部署的 PostgreSQL 服务实例（需提前在 1Panel 中部署 PostgreSQL）
        en: Select a deployed PostgreSQL service instance (deploy PostgreSQL in 1Panel in advance)
      required: true
      values:
        - label: PostgreSQL
          value: postgres
      child:
        type: service
        default: ""
        envKey: PANEL_DB_HOST
        required: true
    - default: 5432
      edit: true
      envKey: PANEL_DB_PORT
      labelEn: Database Port
      labelZh: 数据库端口
      required: true
      rule: paramPort
      type: number
    - default: notygo
      edit: false
      envKey: PANEL_DB_NAME
      labelEn: Database Name
      labelZh: 数据库名
      description:
        zh: 将在所选 PostgreSQL 实例中自动创建
        en: Will be created automatically in the selected PostgreSQL instance
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: notygo
      edit: false
      envKey: PANEL_DB_USER
      labelEn: Database User
      labelZh: 数据库用户
      description:
        zh: 应用访问数据库的专用用户，将自动创建
        en: Dedicated database user for the app, will be created automatically
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: ""
      edit: false
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database Password
      labelZh: 数据库密码
      description:
        zh: 自动生成高强度随机密码，无需手动输入
        en: High-strength random password generated automatically
      random: true
      required: true
      type: password
